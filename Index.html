function sheetColIndexFromLetters(s){let n=0;for(const ch of String(s||'').toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1}
function firstSafeBlankColumn(sheetName){

  const startRow=HEADER_ROWS[sheetName]||1;

  const t=norm(type),s=norm(status);

  if(t==='pv + battery' && s==='lodged pv+batt')return {valid:true,full:true,component:'both',tone:'green',label:'Lodged PV+Batt',reason:''};

function activityMetaHash(text){let s=String(text||'').trim(),h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function rememberActivityMeta(sheet,row,fieldIndex,entryText,type){if(!type||type==='Update')return;const key=`${sheet}|${row}|${fieldIndex}|${activityMetaHash(entryText)}`;activityMeta=activityMeta.filter(x=>x.key!==key);activityMeta.push({key,type,at:Date.now()});activityMetaPersist()}
function findActivityMeta(sheet,row,fieldIndex,entryText){const key=`${sheet}|${row}|${fieldIndex}|${activityMetaHash(entryText)}`;return activityMeta.find(x=>x.key===key)?.type||''}
function replaceActivityMeta(sheet,row,fieldIndex,oldText,newText,type){const oldKey=`${sheet}|${row}|${fieldIndex}|${activityMetaHash(oldText)}`;activityMeta=activityMeta.filter(x=>x.key!==oldKey);rememberActivityMeta(sheet,row,fieldIndex,newText,type)}
function appendHistory(existingText, text){
  const entry=String(text||'').trim();
  if(!entry)return String(existingText||'');
  const stamp=String(new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'})).replace(/ /g,'-');
  const bullet=` - ${entry}`;
  const raw=String(existingText||'').replace(/\r/g,'').trim();
  if(!raw)return `${stamp}\n${bullet}`;
  const lines=raw.split('\n');
  let lastNonEmpty=lines.length-1;
  while(lastNonEmpty>=0&&!String(lines[lastNonEmpty]).trim())lastNonEmpty--;
  if(lastNonEmpty>=0){
    const lastHeader=parseHistoryDate(lines[lastNonEmpty]);
    const stampDate=parseHistoryDate(stamp);
    if(lastHeader&&stampDate&&isoDate(lastHeader)===isoDate(stampDate)){lines.splice(lastNonEmpty+1,0,bullet);return lines.join('\n');}
  }
  return `${raw}\n\n${stamp}\n${bullet}`;
}

function installerActionRows(){
  const out=[];
  for(const r of activeRecords()){
    if(!['Installed (Missing Info)','RFI','RFI - Escalations','CER Audited/Rejected Jobs'].includes(r.sheet))continue;
    if(!norm(r.waitingOn).includes('installer'))continue;
    if(!r.followUpDue)continue;
    if(dateOnly(r.followUpDue)>today())continue;
    out.push({...r,action:'Installer follow-up',priority:isOverdue(r)?'High':'Medium'});
  }
  return out.sort((a,b)=>(a.followUpDue||new Date(9999,0,1))-(b.followUpDue||new Date(9999,0,1)));
}
function ccewRows(){
  const out=[];
  for(const r of records('Installed (Missing Info)')){
    if(!issueHas(r,'CCEW'))continue;
    const blocks=activityBlocks(r.update||'');const latest=norm(blocks.length?blocks[blocks.length-1].text:(r.update||''));
    if(latest.includes('ccew issued')||latest.includes('ccew uploaded')||latest.includes('uploaded ccew'))continue;
    out.push({...r,source:'Installed CCEW',action:'CCEW follow-up'});
  }
  for(const r of records('CCEW Creation ACT')){
    if(norm(r.status)==='pending')out.push({...r,source:'ACT CCEW',action:'Confirm internal ownership'});
  }
  return out.sort((a,b)=>{
    const da=a.followUpDue?dateOnly(a.followUpDue):new Date(9999,0,1),db=b.followUpDue?dateOnly(b.followUpDue):new Date(9999,0,1);return da-db;
  });
}

function filterSummary(groups){

  for(const j of groups){if(j.source==='Installed / Missing Info')counts.Installed++;else if(j.source==='RFI')counts.RFI++;else if(j.source==='CER Audit')counts.CER++;else if(j.source==='EOD')counts.EOD++;else if(j.source==='ACT CCEW')counts.ACT++;}
  const sameStage=groups.reduce((n,j)=>n+sameStageDuplicateCount(j.gwt,j.records),0);
  const lodgedReview=groups.filter(j=>j.lodgedReview).length;
  return `<div class=\"mini-list\"><div class=\"mini-item\"><div class=\"line\"><strong>Workflow stage mix</strong><span class=\"subtle\">${groups.length} active job groups</span></div><small>Installed ${counts.Installed} · RFI ${counts.RFI} · CER ${counts.CER} · ACT CCEW ${counts.ACT} · Partial EOD ${groups.filter(j=>j.eodPartial).length}</small></div><div class=\"mini-item\"><div class=\"line\"><strong>Same-stage/component review</strong><span class=\"badge ${sameStage?'amber':'green'}\">${sameStage?'Review '+sameStage:'None'}</span></div><small>Cross-stage GWT repeats are normal. RFI PV + Battery rows are distinct components.</small></div><div class=\"mini-item\"><div class=\"line\"><strong>Lodged Review</strong><span class=\"badge ${lodgedReview?'amber':'green'}\">${lodgedReview}</span></div><small>Installed (Missing Info) still active while a full EOD lodgement record exists.</small></div><div class=\"mini-item\"><div class=\"line\"><strong>Jobs & Queue rule</strong></div><small>Fully lodged EOD-only rows are excluded. Only PV + Battery rows with Lodged PV only or Lodged Battery Only remain in the action queue.</small></div></div>`;
}

function customerCallRows(){
  const out=[];
  for(const r of records('Installed (Missing Info)')){
    if(!includesAny(r.issue,['Customer Signature'])&&!norm(r.waitingOn).includes('customer'))continue;
    const activeOwnerText=norm(`${r.blocker} ${r.waitingOn}`);
    const blocked=includesAny(activeOwnerText,['open case','support case','service case','team comms','return to site','site revisit','awaiting installer','awaiting inspection']);
    if(blocked)continue;
    const age=daysBetween(r.installDate,today());
    const due=r.followUpDue;
    const dueCall=due&&dateOnly(due)<=today();
    const sigCall=age!=null&&age>3;
    const latest=latestHistoryText(r.update);
    const committed=includesAny(latest,['will sign','already signed','call me back','sign later','signed the form']);
    if((dueCall||sigCall)&&!committed)out.push({...r,action:'Customer call',due:due||new Date(today().getTime()),priority:due&&dateOnly(due)<today()?'High':'Medium'});
  }
  return out.sort((a,b)=>(a.due||new Date(9999,0,1))-(b.due||new Date(9999,0,1)));
}

function saveEodLog(){
  const h=headerList('EOD');
  const data={Date:$('eodLogDate').value,Customer:$('eodLogCustomer').value.trim(),GWT:gwt($('eodLogGwt').value),JobType:$('eodLogJobType').value,Status:$('eodLogStatus').value,System:$('eodLogSystem').value,CCEW:$('eodLogCcew').value,PVPay:$('eodLogPvPay').value,BATPay:$('eodLogBatPay').value,PVLodged:$('eodLogPvLodged').checked,BATLodged:$('eodLogBatLodged').checked,SolarDiscount:parseMoneyInput($('eodLogSolarDiscount').value),BatteryDiscount:parseMoneyInput($('eodLogBatteryDiscount').value)};
  if(!data.GWT||!data.Customer){alert('GWT ID and Customer Name are required.');return}
  if(!data.Date){alert('EOD Date is required.');return}
  if(!data.JobType||!EOD_JOBTYPE_OPTIONS.includes(data.JobType)){alert('Select the Job Type: PV only, Battery only or PV + Battery.');return}
  if(!EOD_STATUS_OPTIONS.includes(data.Status)){alert('Select one of the permitted EOD statuses.');return}
  const sem=eodSemantic(data.JobType,data.Status);
  if(!sem.valid){alert(sem.reason);return}
  if(data.System===''||data.CCEW===''){alert('Confirm System Details Match and MSB / CCEW Attached.');return}
  const needPv=sem.component==='pv'||sem.component==='both', needBat=sem.component==='battery'||sem.component==='both';
  if(needPv && (!data.PVPay||!data.PVLodged)){alert('This lodgement requires the PV payment method and confirmation that the PV STC lodged date was added to Zoho + tracker.');return}
  if(needBat && (!data.BATPay||!data.BATLodged)){alert('This lodgement requires the BAT payment method and confirmation that the BAT STC lodged date was added to Zoho + tracker.');return}
  const sameDay=records('EOD').filter(r=>r.gwt===data.GWT&&r.effectiveDate&&isoDate(r.effectiveDate)===data.Date);
  if(sameDay.length&&!sameDay.some(r=>r.row===allRecords().find(x=>x.sheet==='EOD'&&x.gwt===data.GWT&&x.effectiveDate&&isoDate(x.effectiveDate)===data.Date)?.row)&&!confirm(`An EOD record for this GWT already exists on ${fmtDate(data.Date)}.\n\n${sameDay.map(r=>`${r.gwt} · row ${r.row} · ${r.customer}`).join('\n')}\n\nCreate/save this EOD record anyway?`))return;
  const existing=records('EOD').find(r=>r.gwt===data.GWT&&r.effectiveDate&&isoDate(r.effectiveDate)===data.Date);
  const target=existing?.row || appendRow('EOD',new Array(h.length).fill(''));
  for(let i=0;i<h.length;i++){
    const hd=h[i],hn=normHeader(hd);if(isPlaceholderHeader(hd))continue;
    let v=existing?existing.values[i]:'';
    if(hn==='date')v=parseExcelDate(data.Date)||data.Date;
    else if(hn==='gwtid')v=data.GWT;
    else if(hn==='customername')v=data.Customer;
    else if(hn==='systemdetailsmatch')v=data.System==='Yes';
    else if(hn==='ccewmsbattached')v=data.CCEW==='Yes';
    else if(hn==='pvstcpaymentmethod')v=data.PVPay;
    else if(hn==='batstcpaymentmethod')v=data.BATPay;
    else if(hn==='pvstclodgeddate')v=!!data.PVLodged;
    else if(hn==='batstclodgeddate')v=!!data.BATLodged;
    else if(hn==='status')v=data.Status;
    else if(hn==='jobtype'){
      // Preserve the workbook's formula-backed Job Type. New rows outside the formula range use the derived value.
      if(eodJobTypeFormulaContainsRow(target))continue;
      v=data.JobType;
    }
    else if(hn==='solarstcdiscountamount')v=data.SolarDiscount;
    else if(hn==='batterystcdiscountamount')v=data.BatteryDiscount;
    setCellPreserve(wb.Sheets['EOD'],target,i,coerce(hd,v));
    if(hn==='solarstcdiscountamount'||hn==='batterystcdiscountamount'){const addr=XLSX.utils.encode_cell({r:target-1,c:i});if(wb.Sheets['EOD'][addr])wb.Sheets['EOD'][addr].z='$#,##0.00';}
  }
  dirty=true;resetCache();closeModal();app.eodDate=data.Date;show('eod');openJob(data.GWT,'eod','EOD',target)
}

      const title=s.properties?.title||'';const rows=(valuesBySheet[title]||[]).map(r=>r||[]);
      const ws=XLSX.utils.aoa_to_sheet(rows);
      if(!ws['!ref'])ws['!ref']='A1';
      out.SheetNames.push(title);out.Sheets[title]=ws;
    }
    return out;
  }
  async function loadGoogleWorkbook(){
    await fetchMeta();
    const values=await fetchAllValues(state.sheetMeta,(d,t)=>{updateGoogleUi();});
    return buildWbFromGoogle(state.sheetMeta,values);
  }
  function adoptGoogleWorkbook(parsed){
    const prev={wb,dirty,cache,currentRaw,rawPage,eodDate:app.eodDate,eowWeekEnd:app.eowWeekEnd,eowDraft:app.eowDraft};
    try{
      suspendGoogle(()=>{wb=parsed;materializeEodJobTypeFormula();resetCache();currentRaw=wb.SheetNames.includes('EOD')?'EOD':wb.SheetNames[0];rawPage=1;app.eodDate=isoDate(today());app.eowWeekEnd=isoDate(endOfWeek(today()));app.eowDraft=null;});
      dirty=false;resetCache();renderView();statusLineGoogle();
      return true;
    }catch(e){wb=prev.wb;dirty=prev.dirty;cache=prev.cache;currentRaw=prev.currentRaw;rawPage=prev.rawPage;app.eodDate=prev.eodDate;app.eowWeekEnd=prev.eowWeekEnd;app.eowDraft=prev.eowDraft;throw e}
  }

  async function authorizeGoogle(){
    state.lastError='';
    try{
      await getToken(true);
      state.googleAuthorized=true;
      log('Google account authorised for Sheets access','success');
      renderGoogleConnectStep2();
    }catch(e){
      state.googleAuthorized=false;
      log(`Google authorization failed: ${e.message}`,'error');
      setGooglePanel(`<div class="google-error"><b>Google authorization failed.</b><br>${esc(e.message)}<br><span class="subtle">Make sure this CRM is opened from the authorised GitHub Pages URL, not by double-clicking the HTML file.</span></div>`);
    }
  }
  function renderGoogleConnectStep2(){
    $('modalCard').innerHTML=`<div class="modal-head"><div><h2>Connect your Green Deal Google Sheet</h2><div class="subtle">Google account authorised. Now select the live tracker.</div></div><button onclick="closeModal()">✕</button></div>
      <div class="google-success"><b>Google account connected.</b><br>Clara has permission to use the Google Sheets API on your behalf. Your access token remains in browser memory.</div>
      <div class="google-config" style="margin-top:12px"><div class="field"><label>Google Spreadsheet ID</label><input id="googleSheetRef" placeholder="15RUWnKO-L7GN9BAMhzRn-pQCgegBZ9ZQgGaNH55S3dI" value="${esc(state.spreadsheetId||'')}"></div>
      <label class="inline-label"><input id="googleAutoSync" type="checkbox" ${state.autoSync?'checked':''}> Automatically pull Google changes every 30 seconds when idle</label>
      <div class="hint">Paste the Spreadsheet ID from the Google Sheets URL. Clara uses the ID directly and does not require the full URL.</div></div>
      <div id="googlePanelExtra"></div><div class="modal-foot"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="loadConnectedGoogleSheet()">Verify & Load Sheet</button></div>`;
  }
  async function loadConnectedGoogleSheet(){
    const sheetInput=$('googleSheetRef')?.value.trim()||'';
    const sid=String(sheetInput).trim();
    if(!/^[a-zA-Z0-9_-]{20,}$/.test(sid)){setGooglePanel('<div class="google-error"><b>Invalid Google Spreadsheet ID.</b><br>Paste the Spreadsheet ID only, not the full Google Sheets URL.</div>');return}
    state.spreadsheetId=sid;state.autoSync=$('googleAutoSync')?.checked!==false;cfgPersist();
    if(dirty&&!confirm('The CRM has local unsaved changes. Connecting to Google will replace the local workbook with the live Google Sheet and discard those local changes. Continue?'))return;
    state.syncing=true;state.lastError='';updateGoogleUi();
    try{
      const parsed=await loadGoogleWorkbook();
      const expected=['EOD','Installed (Missing Info)','RFI','RFI - Escalations','CER Audited/Rejected Jobs','CCEW Creation ACT','Subcontractor List'];
      const missing=expected.filter(s=>!parsed.Sheets[s]);
      if(missing.length)throw new Error('The Google Sheet is missing required tab(s): '+missing.join(', '));
      adoptGoogleWorkbook(parsed);state.connected=true;state.syncing=false;state.lastSyncAt=Date.now();log(`Connected to “${state.spreadsheetTitle}”`, 'success');startAutoSync();
      openGoogleModal('connected');
    }catch(e){state.syncing=false;log(`Connection failed: ${e.message}`,'error');updateGoogleUi();setGooglePanel(`<div class="google-error"><b>Connection failed.</b><br>${esc(e.message)}</div>`)}
  }
  async function connectGoogle(){
    if(state.connected){openGoogleModal('connected');return}
    openGoogleModal('config');
    await authorizeGoogle();
  }
  async function refreshGoogle(silent=false){
    if(!state.connected||state.syncing)return;
    if(state.pending.size||state.structural.length||dirty){if(!silent)alert('Google refresh paused because the CRM has unsaved changes.');return}
    state.syncing=true;updateGoogleUi();
    try{
      const parsed=await loadGoogleWorkbook();
      suspendGoogle(()=>{wb=parsed;resetCache();});dirty=false;state.lastSyncAt=Date.now();renderView();log(`Refreshed Google Sheet at ${nowTime()}`,'success');
    }catch(e){log(`Refresh failed: ${e.message}`,'error');if(!silent)alert('Google refresh failed: '+e.message)}
    finally{state.syncing=false;updateGoogleUi()}
  }
  async function ensureDeleteAnchors(){
    if(!state.structural.length)return;
    const dels=state.structural.filter(x=>x.type==='deleteRow');
    if(!dels.length)return;
    const params=new URLSearchParams();dels.forEach(d=>params.append('ranges',apiRange(d.sheet,d.row,d.row)));params.set('valueRenderOption','UNFORMATTED_VALUE');
    const p=await api(`spreadsheets/${encodeURIComponent(state.spreadsheetId)}/values:batchGet?${params.toString()}`);
    const ranges=p.valueRanges||[];
    for(let i=0;i<dels.length;i++){
      const vals=ranges[i]?.values?.[0]||[],r=dels[i];const h=headerList(r.sheet);const gi=colIndex(h,['GWT ID','GWTID','GWT']),ci=colIndex(h,['Customer Name','Customer']),ai=colIndex(h,['Address']);
      const remote={gwt:gi>=0?gwt(vals[gi]):'',customer:ci>=0?String(vals[ci]??''):'',address:ai>=0?String(vals[ai]??''):''};
      if(valueSig(remote.gwt)!==valueSig(r.anchor.gwt)||valueSig(remote.customer)!==valueSig(r.anchor.customer)||valueSig(remote.address)!==valueSig(r.anchor.address))throw new Error(`Conflict detected before deleting ${r.sheet} row ${r.row}. The Google row no longer matches the CRM job anchor.`);
    }
  }
  function newValueFromCellKey(key){const [sheet,addr]=key.split('|');const ws=wb?.Sheets?.[sheet];const c=ws?.[addr];if(!c)return '';if(c.v instanceof Date)return isoDate(c.v);return c.v==null?'':c.v}
  async function conflictCheck(){
    if(!state.pending.size&&!state.structural.length)return;
    const keys=[...state.pending.keys()];
    if(keys.length){
      const params=new URLSearchParams();keys.forEach(k=>{const [sheet,addr]=k.split('|');params.append('ranges',`'${sheet.replace(/'/g,"''")}'!${addr}`)});params.set('valueRenderOption','UNFORMATTED_VALUE');
      const payload=await api(`spreadsheets/${encodeURIComponent(state.spreadsheetId)}/values:batchGet?${params.toString()}`);
      const remote=(payload.valueRanges||[]);
      for(let i=0;i<keys.length;i++){const key=keys[i],pre=state.preChange.get(key),remoteVal=remote[i]?.values?.[0]?.[0]??'';if(pre&&valueSig(remoteVal)!==pre.sig){const [sheet,addr]=key.split('|');const local=newValueFromCellKey(key);if(valueSig(remoteVal)!==valueSig(local))throw new Error(`Conflict on ${sheet}!${addr}. Google Sheets changed this cell after the CRM last read. Refresh before saving.`)}}
    }
    await ensureDeleteAnchors();
  }
  function sheetsBatchValueBody(){
    const data=[];for(const key of state.pending.keys()){const [sheet,addr]=key.split('|');data.push({range:`'${sheet.replace(/'/g,"''")}'!${addr}`,majorDimension:'ROWS',values:[[newValueFromCellKey(key)]]})}
    return {valueInputOption:'USER_ENTERED',data};
  }
  async function applyStructuralDeletes(){
    const dels=state.structural.filter(x=>x.type==='deleteRow');if(!dels.length)return;
    const requests=[];
    for(const d of dels){
      const meta=state.sheetMeta?.find(x=>x.properties?.title===d.sheet),sheetId=meta?.properties?.sheetId;
      if(sheetId==null)throw new Error(`Cannot identify the Google sheet ID for ${d.sheet}.`);
      requests.push({deleteDimension:{range:{sheetId,dimension:'ROWS',startIndex:d.row-1,endIndex:d.row}}});
    }
    await api(`spreadsheets/${encodeURIComponent(state.spreadsheetId)}:batchUpdate`,{method:'POST',body:JSON.stringify({requests})});
  }
  async function flushGoogleChanges(){
    if(!state.connected||state.syncing||(!state.pending.size&&!state.structural.length))return;
    state.syncing=true;updateGoogleUi();
    try{
      await conflictCheck();
      if(state.pending.size){const body=sheetsBatchValueBody();await api(`spreadsheets/${encodeURIComponent(state.spreadsheetId)}/values:batchUpdate`,{method:'POST',body:JSON.stringify(body)});}
      await applyStructuralDeletes();
      state.pending.clear();state.preChange.clear();state.structural=[];dirty=false;state.lastSyncAt=Date.now();log(`Saved CRM changes to Google at ${nowTime()}`,'success');
    }catch(e){
      log(`Google save blocked: ${e.message}`,'error');
      // Preserve dirty state so the user can inspect/refresh rather than losing the edit.
      dirty=true;
      if(/Conflict/.test(e.message))alert(e.message+'\n\nNo Google changes were applied. Refresh Google before retrying.');
      else alert('Google save failed: '+e.message);
    }finally{state.syncing=false;updateGoogleUi()}
  }
  function queueGoogleSync(){
    if(!state.connected||state.syncing)return;
    clearTimeout(state.writeQueue);state.writeQueue=setTimeout(()=>flushGoogleChanges(),650);
  }
  function startAutoSync(){
    if(state.syncTimer)clearInterval(state.syncTimer);
    if(!state.connected||!state.autoSync)return;
    state.syncTimer=setInterval(()=>{if(document.visibilityState==='visible'&&!dirty&&!document.querySelector('.modal.open,.drawer.open'))refreshGoogle(true)},AUTO_MS);
  }
  function disconnectGoogle(){
    try{if(state.accessToken&&googleReady())google.accounts.oauth2.revoke(state.accessToken,()=>{})}catch(e){}
    clearGoogleRuntime();log('Disconnected from Google','info');closeModal();
  }
  function googlePanelHtml(mode='config'){
    const connected=state.connected;
    if(connected){
      const history=state.activity.map(x=>`<div class="google-activity-row"><b>${esc(x.ts.toLocaleTimeString('en-AU'))}</b> · ${esc(x.msg)}</div>`).join('')||'<div class="subtle">No activity yet.</div>';
      return `<div class="modal-head"><div><h2>Google Sheets Live Connection</h2><div class="subtle">Direct Google Sheets API connection. No Apps Script is used.</div></div><button onclick="closeModal()">✕</button></div>
        <div class="google-success"><b>Connected.</b> CRM changes are pushed directly to Google Sheets after each edit batch. Access tokens are kept only in browser memory.</div>
        <div class="google-live-grid" style="margin-top:12px"><div class="google-live-card"><div class="k">Spreadsheet</div><div class="v">${esc(state.spreadsheetTitle||'—')}</div></div><div class="google-live-card"><div class="k">Last sync</div><div class="v">${state.lastSyncAt?esc(new Date(state.lastSyncAt).toLocaleTimeString('en-AU')):'—'}</div></div><div class="google-live-card"><div class="k">Auto refresh</div><div class="v">${state.autoSync?'30 sec while visible':'Off'}</div></div></div>
        <div class="google-config" style="margin-top:12px"><label class="inline-label"><input id="googleAutoSync" type="checkbox" ${state.autoSync?'checked':''}> Pull Google changes automatically every 30 seconds when the CRM is visible and idle</label>
        <div class="actions"><button class="primary" onclick="refreshGoogle(false)">↻ Sync Now</button><button onclick="googleSaveAutoSync()">Save Sync Setting</button><button class="danger" onclick="disconnectGoogle()">Disconnect</button></div>
        <div class="field"><label>Connected Spreadsheet ID</label><input id="googleSheetRef" value="${esc(state.spreadsheetId||'')}" readonly></div>
        <div class="notice-card"><h4>Operational rule</h4><p>Google Sheets remains the source of truth. The CRM never silently overwrites a Google cell that changed after the CRM last read it. Conflict = stop, refresh, then retry.</p></div>
        <div class="google-activity"><div class="subtle" style="margin-bottom:5px">Recent connection activity</div>${history}</div></div>
        <div class="modal-foot"><button onclick="closeModal()">Close</button><button class="primary" onclick="loadConnectedGoogleSheet()">Re-verify / Reload Sheet</button></div>`;
    }
    if(!state.googleAuthorized){
      return `<div class="modal-head"><div><h2>Connect Clara to Google Sheets</h2><div class="subtle">Secure browser-to-Google connection. No Apps Script or intermediary database.</div></div><button onclick="closeModal()">✕</button></div>
      <div class="google-note"><b>Step 1 — Authorise your Google account.</b><br>Google will open its account/permission screen. Select the Google account that owns or can edit the Green Deal tracker, then approve Google Sheets access.</div>
      <div class="hint">The CRM contains its public OAuth Client ID. You do not need to enter an OAuth Client ID or Client Secret.</div>
      <div class="actions" style="margin-top:16px"><button class="primary" onclick="authorizeGoogle()">Continue with Google</button></div>
      <div class="hint mono">Open Clara from the authorised HTTPS GitHub Pages URL. Do not launch the HTML with file://.</div>
      <div class="actions"><button class="small" onclick="window.open('https://console.cloud.google.com/apis/credentials','_blank')">Google Cloud Credentials</button><button class="small" onclick="window.open('https://console.cloud.google.com/apis/library/sheets.googleapis.com','_blank')">Sheets API</button></div>
      <div id="googlePanelExtra"></div><div class="modal-foot"><button onclick="closeModal()">Cancel</button></div>`;
    }
    return `<div class="modal-head"><div><h2>Connect your Green Deal Google Sheet</h2><div class="subtle">Step 2 — choose the live tracker.</div></div><button onclick="closeModal()">✕</button></div>
      <div class="google-success"><b>Google account authorised.</b> Now enter the Google Sheet Spreadsheet ID.</div>
      <div class="google-config" style="margin-top:12px"><div class="field"><label>Google Sheet Spreadsheet ID</label><input id="googleSheetRef" placeholder="e.g. 1AbC..." value="${esc(state.spreadsheetId||'')}"></div>
      <label class="inline-label"><input id="googleAutoSync" type="checkbox" ${state.autoSync?'checked':''}> Automatically pull Google changes every 30 seconds when idle</label>
      <div class="hint">Enter the Spreadsheet ID only. It is the long value between <span class="mono">/d/</span> and <span class="mono">/edit</span> in the Google Sheets URL.</div></div>
      <div id="googlePanelExtra"></div><div class="modal-foot"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="loadConnectedGoogleSheet()">Verify & Load Sheet</button></div>`;
  }
  function setGooglePanel(extra=''){const el=$('modalCard');if(el){const e=$('googlePanelExtra');if(e)e.innerHTML=extra}}
  function openGoogleModal(mode='config'){
    $('modalCard').innerHTML=googlePanelHtml(mode);$('modal').classList.add('open');
    const ac=$('googleAutoSync');if(ac)ac.onchange=()=>{state.autoSync=ac.checked;cfgPersist();if(state.connected)startAutoSync()};
  }
  function googleSaveAutoSync(){state.autoSync=$('googleAutoSync')?.checked!==false;cfgPersist();startAutoSync();log(state.autoSync?'Automatic Google refresh enabled':'Automatic Google refresh disabled','info');}
  window.openGoogleModal=openGoogleModal;window.connectGoogle=connectGoogle;window.authorizeGoogle=authorizeGoogle;window.loadConnectedGoogleSheet=loadConnectedGoogleSheet;window.refreshGoogle=refreshGoogle;window.disconnectGoogle=disconnectGoogle;window.googleSaveAutoSync=googleSaveAutoSync;
  function attachGoogle(){
    const b=$('googleBtn');if(b)b.onclick=()=>openGoogleModal(state.connected?'connected':'config');
    updateGoogleUi();
  }
  attachGoogle();
})();

</script>
